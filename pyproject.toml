[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code_monkey"]

[project]
name = "code-monkey"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.2.0",
    "langchain-anthropic>=1.3.0",
    "langchain-openai>=1.1.6",
    "langgraph>=1.1,<2",
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "pytest>=8.0.0",
    "langchain-community>=0.4.1",
    "pytest-asyncio>=1.3.0",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.2",
    "prompt-toolkit>=3.0.52",
    "pexpect>=4.9.0",
    "pyte>=0.8.2",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "langchain-experimental>=0.4.1",
    "aiosqlite>=0.22.1",
]
[tool.ruff]
exclude = ["mock_project", "tests/output", ".claude", "test_sandbox"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".env", ".git", ".venv", "output"]
markers = [
    "real_llm: marks tests that make real LLM API calls (excluded from default run; run with -m real_llm)",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "ruff>=0.15.0",
]
