[project]
name = "code-monkey"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.2.0",
    "langchain-anthropic>=1.3.0",
    "langchain-openai>=1.1.6",
    "langgraph>=1.0.5",
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "pytest>=8.0.0",
    "langchain-community>=0.4.1",
    "pytest-asyncio>=1.3.0",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.2",
]
[tool.pytest.ini_options]
pythonpath = ["."]
norecursedir = [".env", ".git", ".venv"]
markers = [
    "real_llm: marks tests that make real LLM API calls (excluded from default run; run with -m real_llm)",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
]
